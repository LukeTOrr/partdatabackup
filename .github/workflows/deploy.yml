# Deploy to Cloud Run Job — same pattern as V4Data/V4Forecast/DailyEmail.
# Before first deploy:
#   1. Replace JOB and IMAGE names below.
#   2. Add repo secret GCP_SA_KEY (Settings → Secrets → Actions); value lives in
#      GCP Secret Manager — see Automations/secrets-registry.md.
#   3. Create each app secret in Secret Manager and list it under --set-secrets.
#   4. Add a row to secrets-registry.md for every new secret.
name: Deploy to Cloud Run

on:
  push:
    branches:
      - master
      - main

env:
  PROJECT_ID: celltech-internal-tools
  REGION: us-central1
  JOB: CHANGE-ME-job-name
  IMAGE: us-central1-docker.pkg.dev/celltech-internal-tools/CHANGE-ME-job-name/app

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & Push Docker image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run Job
        run: |
          SECRETS="HEARTBEAT_SHEET_ID=HEARTBEAT_SHEET_ID:latest"

          gcloud run jobs update $JOB \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --project $PROJECT_ID \
            --set-secrets "$SECRETS" \
            --quiet \
          || gcloud run jobs create $JOB \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --project $PROJECT_ID \
            --set-secrets "$SECRETS" \
            --service-account lukeorr@celltech-internal-tools.iam.gserviceaccount.com \
            --quiet
