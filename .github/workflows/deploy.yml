# Deploy to Cloud Run Job — same pattern as V4Data/V4Forecast/DailyEmail.
# Before first deploy:
#   1. Add repo secret GCP_SA_KEY (Settings → Secrets → Actions); value lives in
#      GCP Secret Manager — see Automations/secrets-registry.md.
#   2. Create the Artifact Registry repo + snapshot bucket (README → First-time setup).
name: Deploy to Cloud Run

on:
  push:
    branches:
      - master
      - main

env:
  PROJECT_ID: celltech-internal-tools
  REGION: us-central1
  JOB: scheduler-sunset
  IMAGE: us-central1-docker.pkg.dev/celltech-internal-tools/scheduler-sunset/app
  SERVICE_ACCOUNT: lukeorr@celltech-internal-tools.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & Push Docker image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run Job
        run: |
          ENV_VARS="JOB_NAME=scheduler-sunset,PROJECT_ID=$PROJECT_ID,SNAPSHOT_BUCKET=celltech-internal-tools-scheduler-snapshots,SELF_TRIGGER_NAME=scheduler-sunset-trigger,DRY_RUN=false"

          gcloud run jobs update $JOB \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --project $PROJECT_ID \
            --set-env-vars "$ENV_VARS" \
            --max-retries 0 \
            --quiet \
          || gcloud run jobs create $JOB \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --project $PROJECT_ID \
            --set-env-vars "$ENV_VARS" \
            --max-retries 0 \
            --service-account $SERVICE_ACCOUNT \
            --quiet
